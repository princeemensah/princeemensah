name: Generate GitHub profile summary cards

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/github-profile-summary-cards.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@v0.11.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: princeemensah
          BRANCH_NAME: main
          UTC_OFFSET: 0
          AUTO_PUSH: true
